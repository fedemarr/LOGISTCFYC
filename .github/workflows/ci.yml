name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No es secreto: hardcodeada para que build/typecheck no fallen por falta
  # de env vars en CI. Nunca poner acá una key real (§0, regla 6).
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
  # Falsa a propósito: los tests de web importan la capa de db (que lanza si
  # DATABASE_URL no está definida) pero nunca conectan en CI.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

jobs:
  lint-typecheck-test:
    name: Lint, typecheck y test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit, sin DB)
        run: pnpm test:ci

      - name: Test unit web
        run: pnpm --filter @fym/web test:unit
